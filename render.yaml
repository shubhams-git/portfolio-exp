# Render Blueprint – connect repo in Render → New Blueprint → select this file.
# Or create a Web Service manually and match these settings.
services:
  - type: web
    name: portfolio-exp-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: CORS_ALLOW_VERCEL_PREVIEW
        value: "true"
      # Comma-separated list of browser origins allowed to call the API.
      # Add your Vercel production URL here (no trailing slash).
      # Example: https://your-app.vercel.app,https://www.yourdomain.com
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app
      # Email address that receives contact form submissions.
      - key: CONTACT_RECEIVER
        value: hello@example.com
      # Rate limiting: 5 submissions per 15 minutes per IP (defaults are fine).
      - key: CONTACT_RATE_LIMIT_MAX
        value: "5"
      - key: CONTACT_RATE_LIMIT_WINDOW_MS
        value: "900000"
      # File path for contact submission storage (relative to backend root).
      - key: CONTACT_STORAGE_PATH
        value: data/contact-submissions.ndjson
